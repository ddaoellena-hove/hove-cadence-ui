# Types, tests et build de la lib sous React 19 (lockfile) et React 18.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: React ${{ matrix.react }}
    # Version fixée : ubuntu-latest est passé en 26.04, où Playwright n'installe pas Chromium
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        react: [18, 19]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - name: Lint
        if: matrix.react == 19
        run: npm run lint
      - name: React 19
        if: matrix.react == 19
        run: |
          npx tsc -b --noEmit
          npx vitest run
          npm run build:lib
          npm run smoke:dist
          npm run check:types
      - name: React 18
        if: matrix.react == 18
        run: npm run test:react18
